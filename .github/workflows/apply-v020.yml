name: Apply HealthLink v0.2.0

on:
  push:
    branches: [healthlink-v0.2.0-health-insights-actions]
    paths:
      - '.healthlink-v020/**'
      - '.github/workflows/apply-v020.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.repository == '1bobby-git/HA-Health-Link'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: healthlink-v0.2.0-health-insights-actions

      - name: Reassemble and verify v0.2.0 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .healthlink-v020/payload.*.b64 | tr -d '\n\r' | base64 --decode > /tmp/healthlink-v020.tar.gz
          echo '5cb5c952a8e10164e0f8ea4c4534e314d98cef75e8bfb003e24f620625a34c59  /tmp/healthlink-v020.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/healthlink-v020.tar.gz -C .
          rm -rf .healthlink-v020
          rm -f .github/workflows/healthlink-source-snapshot.yml
          rm -f .github/workflows/apply-v020.yml

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'homeassistant==2026.9.1' pytest ruff

      - name: Validate Python and Home Assistant behavior
        run: |
          python -m compileall -q custom_components/health_link
          ruff check --select E9,F63,F7,F82 custom_components tests
          python -m pytest -q

      - name: Validate frontend
        run: |
          node --check custom_components/health_link/frontend/health-link-panel.js
          node --test tests/test_panel.cjs

      - name: Commit only the verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'feat: HealthLink personal health intelligence and automation actions (v0.2.0)'
          git push origin HEAD:healthlink-v0.2.0-health-insights-actions

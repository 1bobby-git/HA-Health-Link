name: Apply HealthLink repair
on:
  push:
    branches: [healthlink-v0.1.5-profile-brand-fix]
    paths: ['.healthlink-repair/**', '.github/workflows/apply-healthlink-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == '1bobby-git/HA-Health-Link'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: healthlink-v0.1.5-profile-brand-fix
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: pip install 'homeassistant==2026.9.1' pillow pytest ruff
      - run: python .healthlink-repair/run_repair.py
      - run: python -m compileall -q custom_components/health_link
      - run: ruff check --select E9,F63,F7,F82 custom_components tests
      - run: python -m pytest -q
      - run: node --check custom_components/health_link/frontend/health-link-panel.js && node --test tests/test_panel.cjs
      - name: Commit verified repair to working branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- custom_components tests assets README.md CHANGELOG.md .healthlink-repair
          git commit -m 'fix: family profile discovery and verified brand PNGs (v0.1.5)'
          git push origin HEAD:healthlink-v0.1.5-profile-brand-fix

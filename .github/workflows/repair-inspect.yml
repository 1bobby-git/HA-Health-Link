name: Repair inspection
on:
  push:
    branches: [fix-v0.1.5-profiles-branding]
    paths: [.github/workflows/repair-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install Pillow
      - name: Inspect shipped PNG files
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          for p in sorted(Path('.').glob('**/*.png')):
              print(p, 'bytes=', p.stat().st_size, 'sha256=', hashlib.sha256(p.read_bytes()).hexdigest())
              try:
                  with Image.open(p) as im:
                      im.verify()
                  with Image.open(p) as im:
                      im.load()
                      print('  size=', im.size, 'mode=', im.mode, 'bounds=', im.convert('RGBA').getchannel('A').getbbox())
              except Exception as err:
                  print('  INVALID PNG:', type(err).__name__, str(err))
          PY
      - name: Archive checked-out source
        run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: healthlink-repair-source
          path: source.zip
          retention-days: 1

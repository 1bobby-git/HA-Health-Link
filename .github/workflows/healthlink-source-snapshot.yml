name: HealthLink source snapshot
on:
  push:
    branches: [healthlink-v0.2.0-health-insights-actions]
    paths: [.github/workflows/healthlink-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip HEAD -o /tmp/healthlink-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: healthlink-source-snapshot
          path: /tmp/healthlink-source.zip
          retention-days: 1

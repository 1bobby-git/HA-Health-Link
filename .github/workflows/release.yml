name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/health_link/manifest.json"))["version"])')
          test "$TAG" = "$VERSION" || { echo "Tag $TAG does not match manifest version $VERSION"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "HealthLink $GITHUB_REF_NAME" --generate-notes

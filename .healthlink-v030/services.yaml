
list_available_metrics:
  name: 수집된 건강 항목 조회
  description: 실제 수집된 건강 항목, 노출 상태 및 민감 항목 허용 필요 여부를 반환합니다.
  fields: *profile
import_health_file:
  name: 건강 원본 파일 가져오기
  description: 선택한 프로필로 업로드한 건강 ZIP/XML 또는 지원 ECG CSV/JSON을 로컬로 가져옵니다. iPhone HealthKit을 직접 읽지 않습니다.
  fields:
    config_entry_id:
      selector:
        config_entry: {integration: health_link}
    file_id:
      required: true
      selector:
        file: {accept: '.zip,.xml,.json,.csv'}
    confirm_profile:
      required: true
      default: false
      name: 본인 프로필 자료임을 확인
      selector: {boolean: {}}
    include_sensitive:
      default: false
      name: ECG 등 민감 자료 포함
      selector: {boolean: {}}
    scope:
      default: all
      selector:
        select:
          options: [all, ecg]
import_health_samples:
  name: 건강 원본 JSON 가져오기
  description: 단축어 등에서 이미 읽은 자료를 문서화된 JSON 형식으로 전달합니다. 날짜와 단위를 임의로 추정하지 않습니다.
  fields:
    config_entry_id:
      selector:
        config_entry: {integration: health_link}
    data:
      required: true
      selector: {object: {}}
    confirm_profile:
      required: true
      default: false
      selector: {boolean: {}}
    include_sensitive:
      default: false
      selector: {boolean: {}}
get_ecg_records:
  name: ECG 기록 목록 조회
  description: 민감 자료를 허용한 프로필의 ECG 기록 목록을 반환합니다. 자동 진단이나 실시간 감시가 아닙니다.
  fields:
    config_entry_id:
      selector:
        config_entry: {integration: health_link}
    limit:
      default: 50
      selector:
        number: {min: 1, max: 200, mode: box}
    offset:
      default: 0
      selector:
        number: {min: 0, max: 1000000, mode: box}
get_ecg:
  name: ECG 기록 상세 조회
  description: 지정한 ECG 기록의 원본 분류·평균 심박·측정 시각·자료 출처를 반환합니다.
  fields:
    config_entry_id:
      selector:
        config_entry: {integration: health_link}
    object_uuid:
      required: true
      selector: {text: {}}
get_ecg_waveform:
  name: ECG 파형 조회
  description: 지정한 ECG의 파형을 페이지별로 반환합니다. 단위는 시작 후 초와 mV이며 일반 센서 속성에 전체 파형을 넣지 않습니다.
  fields:
    config_entry_id:
      selector:
        config_entry: {integration: health_link}
    object_uuid:
      required: true
      selector: {text: {}}
    offset:
      default: 0
      selector:
        number: {min: 0, max: 1000000, mode: box}
    limit:
      default: 4096
      selector:
        number: {min: 1, max: 4096, mode: box}

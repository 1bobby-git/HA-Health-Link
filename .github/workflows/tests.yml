name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.8.0", "2026.9.1"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "homeassistant==${{ matrix.homeassistant }}" 'defusedxml==0.7.1' pytest ruff
      - run: ruff check --select E9,F63,F7,F82 custom_components tests
      - run: python -m compileall -q custom_components/health_link
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: node --check custom_components/health_link/frontend/health-link-panel.js
      - run: node --test tests/test_panel.cjs

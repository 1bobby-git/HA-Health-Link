name: Bootstrap HealthLink source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part_*.b64 | base64 -d > /tmp/healthlink.tar.gz
          echo "312f5efa327ce48c6efd098a1feaf59cdbe4553394aceeaf60d8a8ab12422de4  /tmp/healthlink.tar.gz" | sha256sum -c -
          tar -xzf /tmp/healthlink.tar.gz
          rm -rf .bootstrap
          rm -f .healthlink-init
          rm -f .github/workflows/bootstrap.yml

      - name: Validate source structure
        shell: bash
        run: |
          set -euo pipefail
          test -f custom_components/health_link/manifest.json
          test -f custom_components/health_link/__init__.py
          test -f hacs.json
          test -f README.md
          python -m compileall -q custom_components/health_link
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('JSON validation passed')
          PY

      - name: Validate frontend syntax
        shell: bash
        run: |
          node --check custom_components/health_link/frontend/health-link-panel.js

      - name: Commit HealthLink source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish HealthLink v0.1.0"
          git push origin main

      - name: Publish v0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git tag -f v0.1.0
          git push origin v0.1.0 --force
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release edit v0.1.0 --title "HealthLink v0.1.0" --notes "Initial HealthLink release for Home Assistant."
          else
            gh release create v0.1.0 --title "HealthLink v0.1.0" --notes "Initial HealthLink release for Home Assistant."
          fi
